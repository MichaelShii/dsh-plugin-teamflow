name: CI

on:
  push:
    branches: [main, 'release-*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # action 一律用 v5：v4 的 action runtime 是 node20（GitHub 已弃用，会被强制切到 node24 并告警），
      # v5 起改用 node24（实测：checkout/setup-node/pnpm-action-setup 的 v4 = node20，v5 = node24）。
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22.18
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Bundle
        run: pnpm bundle

      # 注：typecheck 依赖宿主私有包 @deepseek-ai/* 的类型（由本机 dsh profile 提供），
      # 公共 CI 无此环境，故不在 CI 跑；请在本地宿主环境下执行 `pnpm typecheck`。
