name: CI

on:
  push:
    branches: [main, 'release-*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.18 = `engines.node` 声明的下限；24.x = 现役 LTS。
        # ⚠️ 矩阵**抓不住**「契约违规被宽松运行时吸收」这一类（2026-10-17 issue #20 追评：伪 AbortSignal
        # 在 Node 24 抛 `signals[1] is not of type AbortSignal.`，而当年同一套测试在 22/24 上全绿）。
        # 真正的门禁是 test/signal-brand.test.js 与 orchestration 里的 brand 断言；矩阵只兜「其它 Node 24 差异」。
        node-version: [22.18, 24.x]
    steps:
      # action 一律用 v5：v4 的 action runtime 是 node20（GitHub 已弃用，会被强制切到 node24 并告警），
      # v5 起改用 node24（实测：checkout/setup-node/pnpm-action-setup 的 v4 = node20，v5 = node24）。
      # 且一律**钉到 commit SHA**（标签可被重指向 ⇒ 可变依赖进了我们的 CI 权限面）。
      # 后面 `# vX.Y.Z` 是给人读的版本锚点；升级由 dependabot 提 PR（它同时改 SHA 与这行注释）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install (frozen lockfile)
        # --ignore-scripts：CI 不需要 git hooks（postinstall 会装 lefthook 并拉二进制），
        # 跳过更快也不受二进制下载影响；git hooks 是本地的事，门禁靠下面的 `pnpm lint`。
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint（oxlint，0 warning 门禁；2026-09-26 引入，存量违规已清零）
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Bundle
        run: pnpm bundle

      # 注：typecheck 依赖宿主私有包 @deepseek-ai/* 的类型（由本机 dsh profile 提供），
      # 公共 CI 无此环境，故不在 CI 跑；请在本地宿主环境下执行 `pnpm typecheck`。
